                        id: "m7-4", title: "Physical vs. Chemical Changes", topic: "Chemistry", coverImg: "svg_inline_chemical_change",
                        levels: {
                            advanced: `### The Science in Depth\nMatter is constantly transforming around us. In chemistry, we strictly classify these transformations into two distinct categories: Physical Changes and Chemical Changes. The classification depends entirely on whether the molecular structure (the chemical identity) of the substance has been fundamentally altered.\n\nIn a ==Physical Change==, the arrangement, state, or shape of the matter changes, but the chemical formula remains absolutely identical. For example, when solid ice melts into liquid water, it undergoes a phase change. The molecules gain kinetic energy and slide past one another, but every single molecule is still H2O. Because no chemical bonds were broken or formed, physical changes are typically easy to reverse. \n\n[IMG:inline_chemical_change]\n\nIn a ==Chemical Change== (a chemical reaction), the intramolecular bonds holding the atoms together are violently broken and rearranged to form entirely **new substances** with completely different properties. Signs that a chemical reaction is occurring include the release of heat or light, the formation of gas bubbles, or a permanent color change. Crucially, the **Law of Conservation of Mass** states that during a chemical reaction, no atoms are ever created or destroyed; they are simply rearranged.\n\n### Local Case Study: Victoria Harbour Rusting\nHong Kong's Victoria Harbour is a bustling maritime hub. Ships constantly face a destructive chemical change: **Oxidation** (Rusting). When strong iron alloys are exposed to Hong Kong's humid air and salty ocean water, the Iron (Fe) chemically reacts with Oxygen (O2) to form Iron Oxide (Fe2O3). The silver, incredibly strong iron permanently transforms into a brittle, reddish-brown powder. Engineers must constantly paint ships with anti-corrosive chemicals to physically block the oxygen from touching the iron, preventing this chemical reaction.`,
                            intermediate: `### The Science in Depth\nEverything in the world is made of matter, and matter can change in two different ways: Physical Changes and Chemical Changes.\n\nIn a ==Physical Change==, the matter changes how it looks, but it is still the exact same stuff on the inside. For example, if you melt an ice cube, it turns into a liquid. But both the ice and the liquid are still made of H2O water molecules! Because no new chemicals were made, physical changes are usually easy to reverse (you can just put the water back in the freezer). Ripping a piece of paper in half is also a physical change.\n\n[IMG:inline_chemical_change]\n\nIn a ==Chemical Change==, the atoms actually break apart and lock together in new ways to create a completely **new substance**. When you burn a piece of wood, the wood chemically changes into smoke and ash. You cannot turn the ash back into wood! You can tell a chemical change is happening if you see fire, if the mixture gets very hot, or if gas bubbles suddenly appear.\n\n### The Golden Rule\nEven though the matter changes into something new, the **Law of Conservation of Mass** says that the total weight stays exactly the same. No atoms are ever deleted; they are just rearranged!\n\n### Local Case Study: Rust in Hong Kong\nHong Kong is a city surrounded by salty ocean water. This causes a major chemical change called **Rusting** (Oxidation). When the strong iron metal on boats touches the oxygen and salty water, the atoms react. The strong iron permanently changes into a weak, orange powder called rust. To stop this chemical reaction, ship workers must paint the metal to physically block the oxygen from touching the iron!`,
                            beginner: `### The Science in Depth\nMatter can change its shape or turn into something completely new! Scientists divide these into two types: Physical Changes and Chemical Changes.\n\nA ==Physical Change== means the object changes shape, but it is still the exact same stuff! Think about melting an ice cube. It turns into a liquid, but it is still water! You can easily reverse it by putting the water back in the freezer to make ice again. Tearing a piece of paper is a physical change because it is still paper.\n\n[IMG:inline_chemical_change]\n\nA ==Chemical Change== means the atoms mix together to create a completely **new thing**. If you bake a cake in the oven, the eggs and flour chemically change into a fluffy cake. You cannot un-bake the cake! You know a chemical change is happening if you see fire, bubbles, or a permanent color change.\n\n### The Golden Rule\nEven though it looks different, no atoms are ever lost! The weight of the cake ingredients is exactly the same as the baked cake. Atoms just rearrange like Lego blocks!\n\n### Local Case Study: Rust in Hong Kong\nHong Kong has lots of boats in the salty ocean. The salt water causes a bad chemical change called **Rusting**. The strong silver metal on the boats chemically reacts with the air and turns into a weak, powdery orange rust! To protect the boats, people have to cover them in thick paint to stop the chemical reaction.`
                        },
                        quiz: [
                            { q: "What is the key defining feature of a Physical Change?", options: ["It always involves fire", "The chemical identity of the substance stays exactly the same", "A completely new substance is formed", "Atoms are destroyed"], answer: 1 },
                            { q: "Which of the following is an example of a Chemical Change?", options: ["Melting ice into water", "Dissolving sugar in tea", "Tearing a piece of paper", "Burning wood into ash and smoke"], answer: 3 },
                            { q: "What does the Law of Conservation of Mass state?", options: ["Chemical changes always lose weight", "Things get heavier when they melt", "No atoms are ever created or destroyed during a reaction, only rearranged", "Mass disappears into the air"], answer: 2 },
                            { q: "Why is the 'Rusting' of ships in Hong Kong considered a Chemical Change?", options: ["Because the iron just gets wet", "Because the iron reacts with oxygen to form a completely new substance (Iron Oxide)", "Because the ship is changing location", "Because the iron melts into a liquid"], answer: 1 },
                            { q: "How can you usually tell a Physical Change apart from a Chemical Change?", options: ["Physical changes are usually easy to reverse (like freezing melted water)", "Physical changes always explode", "Chemical changes are always invisible", "Physical changes create new atoms"], answer: 0 }
                        ]
                    },
                    {
                        id: "m7-5", title: "Acids, Alkalis & The pH Scale", topic: "Chemistry", coverImg: "svg_cover_m7",
                        levels: {
                            advanced: `### The Science in Depth\nTo understand chemical reactivity, scientists classify liquid solutions based on the concentration of specific ions they release. This is measured using the ==pH Scale==, a logarithmic scale ranging from 0 to 14.\n\n**Acids (pH 0 to 6)** release Hydrogen ions (H+) when dissolved in water. The lower the pH, the exponentially stronger the acid. Strong acids, like Hydrochloric Acid (pH 1), are highly corrosive and can violently dissolve metals.\n**Alkalis (pH 8 to 14)** release Hydroxide ions (OH-). Strong alkalis, like Sodium Hydroxide (pH 14), are caustic and excel at breaking down fats and proteins, making them common in heavy-duty cleaning products.\n**Neutral (pH 7)** represents pure water, where the H+ and OH- ions are perfectly balanced.\n\n[IMG:inline_ph]\n\n### The Neutralization Reaction\nWhat happens when you mix a dangerous acid with a dangerous alkali? They undergo a violent **Neutralization Reaction**. The highly reactive H+ ions from the acid bond perfectly with the OH- ions from the alkali, forming safe, stable H2O (Water) and a chemical Salt. **(Acid + Alkali → Salt + Water)**. \n\n### Local Case Study: Hong Kong Acid Rain\nDuring the 1990s, the rapid industrialization of the Pearl River Delta resulted in factories pumping massive amounts of Sulfur Dioxide gas into the atmosphere. When this gas mixed with rainwater clouds, it underwent a chemical reaction to form **Acid Rain**. This slightly acidic rain fell on Hong Kong, severely damaging the leaves of trees in the Country Parks and slowly corroding the limestone and marble buildings in Central. Strict emission laws have since drastically reduced this pollution!`,
                            intermediate: `### The Science in Depth\nChemists measure how dangerous or reactive a liquid is by using a special ruler called the ==pH Scale==. The scale goes from 0 all the way to 14.\n\n**Acids (pH under 7):** Acids taste sour (like lemons). But strong acids (like battery acid at pH 1) are very dangerous and can actually melt metal!\n**Alkalis (pH over 7):** Alkalis feel slippery (like soap). Strong alkalis are great at breaking down grease and fats, so they are used in strong cleaning sprays.\n**Neutral (pH 7):** Pure drinking water is exactly in the middle. It is completely safe.\n\n[IMG:inline_ph]\n\n### The Neutralization Reaction\nWhat happens if you mix a burning acid and a slippery alkali together? They fight and cancel each other out! This is called a **Neutralization Reaction**. The dangerous chemicals rearrange their atoms to form completely safe Salt and Water!\n\n### Local Case Study: Hong Kong Acid Rain\nA long time ago, factories near Hong Kong pumped a lot of dirty sulfur smoke into the sky. When the smoke mixed with the rain clouds, it created **Acid Rain**. When this acid rain fell on Hong Kong, it slowly melted the stone on statues and burned the leaves off trees in our Country Parks! The government had to pass strict laws to stop factories from making the smoke.`,
                            beginner: `### The Science in Depth\nChemists measure liquids using a special science ruler called the ==pH Scale==!\n\n**Acids:** These have a pH lower than 7. They taste sour like lemons! But strong acids are dangerous and can burn your skin.\n**Alkalis:** These have a pH higher than 7. They feel slippery like soap. They are used to clean dirty floors.\n**Neutral:** Pure water has a pH of exactly 7. It is right in the middle and is very safe.\n\n[IMG:inline_ph]\n\n### Canceling Out!\nWhat happens if you mix an acid and an alkali together? They cancel each other out! This is called **Neutralization**. The two dangerous chemicals mix together and turn into safe, normal water and salt!\n\n### Local Case Study: Acid Rain\nA long time ago, factories near Hong Kong made a lot of dirty smoke. The smoke mixed with the clouds and made the rain turn into acid! This was called **Acid Rain**. When the acid rain fell, it hurt the trees and melted the stone statues in the city. Now, we have rules to keep the sky clean!`
                        },
                        quiz: [
                            { q: "What pH number represents a Neutral substance, like pure water?", options: ["0", "7", "14", "100"], answer: 1 },
                            { q: "Which substance is characterized by a sour taste and a pH less than 7?", options: ["An Alkali", "An Acid", "A Metal", "Salt"], answer: 1 },
                            { q: "What are the two products ALWAYS formed during an Acid-Alkali Neutralization reaction?", options: ["Gas and Fire", "Salt and Water", "Sugar and Milk", "Plastic and Glass"], answer: 1 },
                            { q: "What caused the damaging 'Acid Rain' in Hong Kong during the 1990s?", options: ["Birds dropping acid", "Industrial sulfur gas mixing with rain clouds", "Salt water evaporating", "Air conditioners leaking"], answer: 1 },
                            { q: "How does 'Antacid' medicine cure a stomach ache?", options: ["It freezes the stomach", "It is an alkali that neutralizes the excess stomach acid", "It coats the stomach in plastic", "It makes you sleep"], answer: 1 }
                        ]
                    },
                    {
                        id: "m7-6", title: "Gas Pressure & Particle Theory", topic: "Physics & Chemistry", coverImg: "svg_cover_m7",
                        levels: {
                            advanced: `### The Science in Depth\nTo understand how gases behave, we must rely on the **Kinetic Particle Theory of Matter**. This theory states that all matter consists of microscopic particles (atoms and molecules) that are in constant, random motion. In a gas, the particles possess immense kinetic energy; they fly around randomly at high speeds, completely filling the volume of their container.\n\nBecause these gas particles are moving so fast, they constantly collide with the walls of their container. Every single collision exerts a microscopic physical force. When you combine the force of billions of particle collisions, it generates ==Gas Pressure==.\n\n[IMG:inline_pressure]\n\n### The Gas Laws\nThere are mathematical rules governing gas pressure. **Boyle's Law** states that if you decrease the volume of a container (squish it), the particles have less space to fly around. They will hit the walls much more frequently, causing the pressure to drastically increase!\nFurthermore, if you heat a gas, you add thermal energy. The particles absorb this energy, fly much faster, and hit the walls harder. If the container cannot expand, the pressure will increase until the container violently explodes!\n\n### Local Case Study: Hong Kong Typhoons\nMeteorologists closely track atmospheric gas pressure using a barometer. Air naturally flows from areas of High Pressure (where particles are crowded) to Low Pressure (where particles are sparse), creating wind. When an intense, spinning low-pressure system forms over the warm Pacific Ocean, it creates a massive vacuum effect, sucking in violent winds. This is how devastating **Typhoons** form. When the Hong Kong Observatory raises the T8 signal, it means a massive low-pressure vortex is approaching our city!`,
                            intermediate: `### The Science in Depth\nTo understand how gases (like air) work, scientists use the **Particle Theory**. This theory says that everything is made of tiny, invisible particles. In a gas, these particles are full of energy! They fly around super fast in random directions, bouncing off everything.\n\nBecause these gas particles are flying so fast, they constantly crash into the walls of whatever is holding them (like the inside of a balloon). Every crash creates a tiny push. When billions of particles crash into the walls at the same time, it creates ==Gas Pressure==!\n\n[IMG:inline_pressure]\n\n### Changing the Pressure\nIf you take a balloon and squish it to make it smaller, the particles inside have less room to fly. They will hit the walls much more often, making the pressure increase until it pops!\nAlso, if you heat a gas up, the heat gives the particles extra energy. They fly much faster and hit the walls harder. This is why you should never throw a closed spray can into a fire—the pressure inside will get so high it will explode!\n\n### Local Case Study: Hong Kong Typhoons\nWind is just air rushing from a High Pressure area (lots of crowded particles) to a Low Pressure area (empty space). Sometimes, a giant, spinning "Low Pressure" storm forms over the warm ocean. Because the pressure in the middle is so low, it sucks in violent winds like a giant vacuum cleaner! This is how dangerous **Typhoons** form before they crash into Hong Kong!`,
                            beginner: `### The Science in Depth\nAir is a gas, and gases are made of tiny, invisible dots called particles. In a gas, these particles are full of crazy energy! They fly around super fast, bouncing off each other like ping-pong balls.\n\nWhen you blow up a balloon, you are pushing billions of these fast particles inside. Because they are flying so fast, they constantly crash into the rubber walls of the balloon. All those tiny crashes push the rubber outward. This push is called ==Gas Pressure==!\n\n[IMG:inline_pressure]\n\n### Squishing and Heating\nIf you squeeze a balloon to make it smaller, the particles have less room to fly. They hit the walls faster and faster, making the pressure go up until POP!\nIf you make a gas hot, the particles get excited and fly even faster. They hit the walls very hard. This is why hot air balloons can fly high in the sky!\n\n### Local Case Study: Typhoons\nWind happens when air rushes from a High Pressure spot to a Low Pressure spot. In the summer, a giant spinning circle of "Low Pressure" can form over the ocean. It acts like a giant vacuum cleaner, sucking in super strong winds. This is how scary **Typhoons** form before they crash into Hong Kong!`
                        },
                        quiz: [
                            { q: "According to the Kinetic Particle Theory, how do particles behave in a gas?", options: ["They are frozen solid", "They vibrate slowly in place", "They fly around randomly at high speeds", "They sink to the bottom"], answer: 2 },
                            { q: "What creates Gas Pressure inside a container like a balloon?", options: ["Gravity pulling down", "Billions of gas particles constantly colliding with the walls", "Light shining on it", "The rubber stretching"], answer: 1 },
                            { q: "What happens to the pressure if you drastically heat up a sealed container of gas?", options: ["The pressure increases because particles fly faster and hit harder", "The pressure decreases", "The particles turn into liquid", "The particles stop moving"], answer: 0 },
                            { q: "How are devastating Typhoons related to air pressure?", options: ["They are areas of High Pressure", "They form as intense, spinning Low-Pressure systems that suck in violent winds", "They have zero pressure", "They are caused by underwater pressure"], answer: 1 },
                            { q: "Why is an airplane cabin pressurized when flying high in the sky?", options: ["To make the plane heavier", "Because the outside air pressure is too low for humans to breathe normally", "To keep the plane warm", "To stop the engines from freezing"], answer: 1 }
                        ]
                    },
                    {
                        id: "m7-7", title: "Chemical Bonds & Compounds", topic: "Chemistry", coverImg: "svg_cover_m7",
                        levels: {
                            advanced: `### The Science in Depth\nThe vast complexity of the universe is created by just 118 fundamental elements. How can so few elements create everything from DNA to steel? The secret lies in the electrons and the formation of ==Chemical Bonds==.\n\nAtoms are most stable when their outermost electron shell is completely full. Most atoms do not have a full valence shell naturally, making them highly reactive. To achieve stability, atoms will violently collide and interact to form a **Compound**.\n\n[IMG:inline_bonds]\n\nThere are two primary ways atoms achieve a full shell:\n1. **Ionic Bonds:** This occurs when a metal atom permanently *steals* an electron from a non-metal atom. Because one atom loses a negative electron and the other gains it, they become oppositely charged ions (one positive, one negative). They are then drawn together by a massive electrostatic magnetic force. (Example: Sodium Chloride / Table Salt).\n2. **Covalent Bonds:** This occurs between two non-metal atoms. Instead of stealing, they *share* pairs of electrons between their overlapping clouds. This sharing locks the atoms together into a strong, stable molecule. (Example: H2O / Water).\n\n### The Law of Definite Proportions\nWhen atoms bond to form a compound, they do so in exact ratios. Water is ALWAYS H2O (two Hydrogen, one Oxygen). If you alter the ratio to H2O2, it becomes Hydrogen Peroxide, a toxic chemical!\n\n### Local Case Study: Hong Kong's Neon Signs\nFor decades, the streets of Hong Kong were illuminated by glowing Neon signs. These signs utilize the Noble Gases (Neon, Argon, Krypton). These noble gases are unique because their valence electron shells are *already naturally full*. Therefore, they are completely unreactive; they refuse to form chemical bonds with anything!`,
                            intermediate: `### The Science in Depth\nThere are only about 100 basic elements in the whole universe. How can so few elements make everything from water to rocks to human beings? The secret is how the atoms lock together to make ==Chemical Bonds==!\n\nAtoms want to be perfectly balanced and stable. To get stable, atoms will crash into each other and connect to form a new **Compound**.\n\n[IMG:inline_bonds]\n\nThere are two main ways atoms stick together:\n1. **Ionic Bonds:** One atom is a bully and completely *steals* an electron from the other atom! Because one becomes positive and one becomes negative, they stick together like strong magnets. (Example: Salt).\n2. **Covalent Bonds:** The two atoms are friendly and *share* their electrons. By holding hands and sharing, they lock together tightly into a strong molecule. (Example: Water).\n\n### Exact Recipes\nWhen atoms make a compound, they follow an exact recipe. Water is ALWAYS H2O (two Hydrogen atoms holding hands with one Oxygen atom). If you change the recipe and add one more oxygen to make H2O2, it is no longer safe water! It becomes Hydrogen Peroxide, a toxic chemical used to clean cuts!\n\n### Local Case Study: Hong Kong's Neon Signs\nHong Kong used to be famous for its bright, glowing Neon signs on the streets. These signs are filled with special elements called Noble Gases (like Neon). Noble gases are very special because their atoms are already perfectly stable! They refuse to form chemical bonds with any other elements. When you shoot electricity through the pure Neon gas, it glows bright red but is perfectly safe and won't explode.`,
                            beginner: `### The Science in Depth\nThere are only about 100 basic elements (like Lego blocks) in the whole world! How do we build everything? We stick the atoms together using ==Chemical Bonds==!\n\nAtoms don't like to be alone. They crash into each other and lock together to form a new **Compound**.\n\n[IMG:inline_bonds]\n\nThere are two ways atoms lock together:\n1. **Stealing (Ionic):** One strong atom steals a piece of another atom. This turns them into magnets, and they snap together tightly! (This is how Salt is made).\n2. **Sharing (Covalent):** The two atoms are friendly and hold hands, sharing their pieces. They lock together into a strong molecule! (This is how Water is made).\n\n### Following the Recipe\nAtoms must follow an exact recipe to make a compound. Water is ALWAYS H2O (two Hydrogen atoms holding hands with one Oxygen atom). If you change the recipe, you don't get water anymore; you get a totally different, dangerous chemical!\n\n### Local Case Study: Hong Kong Neon Signs\nHong Kong is famous for its glowing Neon street signs. These signs use a special element called Neon gas. Neon is a "Noble Gas." This means its atoms are already perfectly happy being alone! They refuse to bond or mix with anyone else. When electricity hits the pure gas, it glows bright red!`
                        },
                        quiz: [
                            { q: "What is it called when two or more atoms lock together to achieve stability?", options: ["A physical mixture", "A Chemical Bond (Compound)", "A radiation burst", "Evaporation"], answer: 1 },
                            { q: "What happens during a Covalent Bond (like in H2O)?", options: ["One atom steals an electron", "The atoms explode", "The atoms share pairs of electrons to lock together", "The atoms turn into gas"], answer: 2 },
                            { q: "What happens if you change the exact atomic ratio of a compound (e.g., changing H2O to H2O2)?", options: ["It gets heavier", "It forms an entirely different substance with different properties", "It becomes pure water", "Nothing happens"], answer: 1 },
                            { q: "Why are the 'Noble Gases' (like Neon) used in Hong Kong street signs?", options: ["They are highly explosive", "Their electron shells are already full, making them unreactive and safe", "They are liquid at room temperature", "They are very heavy"], answer: 1 },
                            { q: "What amazing futuristic material is created when Carbon atoms bond in a perfect, single-layer hexagon pattern?", options: ["Graphite", "Graphene", "Diamond", "Plastic"], answer: 1 }
                        ]
                    },
                    {
                        id: "m7-8", title: "Radioactivity & Nuclear Energy", topic: "Physics & Chemistry", coverImg: "svg_cover_m7",
                        levels: {
                            advanced: `### The Science in Depth\nMost atoms in the universe are stable; their nuclei remain perfectly intact forever. However, some very heavy elements, such as Uranium and Plutonium, have nuclei that are simply too large. The repulsive force between the positive protons overcomes the Strong Nuclear Force holding them together. These elements are unstable, meaning they undergo spontaneous ==Radioactive Decay==.\n\nTo achieve stability, an unstable nucleus will literally rip itself apart, violently ejecting fragments of itself at high speeds. This ejected energy and matter is **Radiation**. There are three main types:\n1. **Alpha Particles:** Heavy, slow-moving fragments. Blocked by a single sheet of paper.\n2. **Beta Particles:** High-speed electrons ejected from the nucleus. Blocked by a thin sheet of aluminum.\n3. **Gamma Rays:** Pure, high-frequency electromagnetic energy. Gamma rays are incredibly dangerous, highly penetrating, and require thick lead or concrete to block. They carry enough energy to instantly shatter human DNA, causing severe radiation sickness and cancer.\n\n[IMG:inline_radioactivity]\n\n### Harnessing the Atom: Nuclear Fission\nIn the 1930s, scientists discovered how to artificially force a heavy atom to split by firing a neutron at it. This process is called **Nuclear Fission**. When the Uranium atom splits, it releases millions of times more thermal energy than burning a piece of coal!\n\n### Local Case Study: Daya Bay Nuclear Power Plant\nHong Kong imports approximately 25% of its electricity from the **Daya Bay Nuclear Power Plant** in Shenzhen. Inside the reactor, controlled nuclear fission generates extreme heat. This heat boils water into steam, spinning giant turbines to create electricity with zero carbon emissions. To protect the public from the deadly Gamma radiation, the reactor core is encased in meters of reinforced concrete.`,
                            intermediate: `### The Science in Depth\nMost atoms in the universe are stable and stay the same forever. But some elements, like Uranium, are so huge and heavy that they are unstable. They cannot hold themselves together! These heavy elements undergo ==Radioactive Decay==.\n\nTo become stable, the heavy atom violently spits out pieces of itself. This invisible flying energy is called **Radiation**. There are three main types:\n1. **Alpha Radiation:** Heavy and slow. It can be blocked by a piece of paper.\n2. **Beta Radiation:** Faster particles. They can be blocked by a sheet of metal.\n3. **Gamma Radiation:** Pure, invisible energy! Gamma rays are incredibly dangerous and can easily pass right through the human body, damaging your DNA. It takes thick walls of heavy lead to block them!\n\n[IMG:inline_radioactivity]\n\n### Splitting the Atom: Nuclear Fission\nScientists learned how to shoot a tiny particle at a heavy Uranium atom to force it to split in half! This is called **Nuclear Fission**. When the atom splits, it releases millions of times more heat than burning a massive pile of coal!\n\n### Local Case Study: Daya Bay Power Plant\nWhere does Hong Kong get its electricity? About 25% of our power comes from the **Daya Bay Nuclear Power Plant** in Shenzhen. Inside the giant factory, they use Nuclear Fission to create massive heat. The heat boils water into steam to spin a generator. It creates huge amounts of electricity without making any air pollution! The dangerous radioactive core is safely locked inside walls of thick concrete so the radiation cannot escape.`,
                            beginner: `### The Science in Depth\nMost atoms are perfectly stable. But some atoms, like Uranium, are just too big and heavy! Because they are too heavy, they fall apart. This is called ==Radioactivity==.\n\nWhen the heavy atom falls apart, it shoots out invisible, fast-moving energy called **Radiation**. There are different types of radiation. The most dangerous one is called **Gamma Rays**. Gamma rays are invisible energy that can pass right through your body like an X-Ray. They are very dangerous, and it takes a thick, heavy wall of metal to stop them!\n\n[IMG:inline_radioactivity]\n\n### Splitting the Atom\nScientists found a trick! They can force a heavy atom to split perfectly in half. This is called **Nuclear Fission**. When the atom splits, it releases an explosion of incredible heat! Splitting one tiny atom makes more heat than a giant fire!\n\n### Local Case Study: Daya Bay Power Plant\nHong Kong uses a lot of electricity. A lot of our electricity comes from the **Daya Bay Nuclear Power Plant** right next to Hong Kong. Inside the plant, they split atoms to make massive heat. The heat boils water to make steam, and the steam spins a machine to make electricity! The best part is, it doesn't make any dirty smoke for the sky! The dangerous radiation is locked safely inside thick concrete walls.`
                        },
                        quiz: [
                            { q: "What causes a heavy element like Uranium to be 'Radioactive'?", options: ["It is too cold", "Its nucleus is too large and unstable, causing it to spontaneously decay and eject fragments", "It has too many electrons", "It is made of gas"], answer: 1 },
                            { q: "Which type of radiation is pure, high-frequency energy that requires thick lead or concrete to block?", options: ["Alpha Particles", "Beta Particles", "Gamma Rays", "Microwaves"], answer: 2 },
                            { q: "What is 'Nuclear Fission'?", options: ["Combining two atoms together", "Freezing an atom", "Artificially splitting a heavy atom to release massive thermal energy", "Burning coal"], answer: 2 },
                            { q: "How does the Daya Bay Nuclear Power Plant supply 25% of Hong Kong's electricity?", options: ["By burning millions of tons of coal", "By using the extreme heat of nuclear fission to boil water and spin turbines", "By using giant solar panels", "By importing batteries"], answer: 1 },
                            { q: "How do doctors use controlled Gamma radiation in medicine?", options: ["To make people glow", "To precisely target and destroy cancer cells", "To cure headaches", "To freeze blood"], answer: 1 }
                        ]

            return { title: 'Novice Explorer', icon: 'fa-seedling', color: 'text-yellow-300', bg: 'bg-yellow-900/80' };

        async function syncCloudData(forceSync = false) {
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_LINK_HERE" || !GOOGLE_WEB_APP_URL.startsWith("http")) return safeStorage.get('hkuga_science_scores_t1');
            
            const now = Date.now();
            if (!forceSync && window.cloudRecords && window.cloudRecords.length > 0 && (now - window.lastSyncTime < 60000)) {
                return window.cloudRecords;
            }

            try {
                const statusEl = document.getElementById('cloud-sync-status');
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-down animate-bounce"></i> Syncing...`;
                
                let res = await fetch(GOOGLE_WEB_APP_URL, { method: 'GET', redirect: 'follow' });
                let data = await res.json();
                
                window.cloudRecords = data.map(row => {
                    let normalized = {};
                    for(let key in row) normalized[key.toLowerCase()] = row[key];
                    return {
                        ...row,
                        articleId: normalized.articleid || row.articleId,
                        answers: normalized.answers || row.answers
                    };
                });
                
                window.lastSyncTime = now;
                safeStorage.set('hkuga_science_scores_t1_backup', window.cloudRecords);
                
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-check text-green-400"></i> Cloud Synced`;
                return window.cloudRecords;
            } catch(e) {
                const statusEl = document.getElementById('cloud-sync-status');
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-xmark text-red-400"></i> Offline Mode`;
                let backup = safeStorage.get('hkuga_science_scores_t1_backup');
                let local = safeStorage.get('hkuga_science_scores_t1');
                return (backup && backup.length > 0) ? backup : local;
            }
        }

        function getLeaderboardHtml() {
            const localRecs = safeStorage.get('hkuga_science_scores_t1') || [];
            const cloudRecs = window.cloudRecords || [];
            const allRecs = [...localRecs, ...cloudRecs];
            
            if (allRecs.length === 0) return '';
            
            const uniqueMap = new Map();
            allRecs.forEach(r => {
                const key = `${r.classId}_${r.studentNum}_${r.articleId}`;
                if (!uniqueMap.has(key) || r.score > uniqueMap.get(key).score) {
                    uniqueMap.set(key, r);
                }
            });
            
            let classStats = {};
            uniqueMap.forEach(r => {
                if(!r.classId) return;
                let cId = String(r.classId).toUpperCase();
                if (!classStats[cId]) classStats[cId] = { score: 0, total: 0, students: new Set() };
                classStats[cId].score += r.score;
                classStats[cId].total += r.total;
                classStats[cId].students.add(r.studentNum);
            });
            
            let lb = Object.keys(classStats).map(c => ({
                id: c,
                acc: Math.round((classStats[c].score / classStats[c].total) * 100) || 0,
                active: classStats[c].students.size
            })).sort((a,b) => b.acc - a.acc);
            
            if (lb.length === 0) return '';
            
            let html = `<div class="bg-gradient-to-tr from-slate-900 to-indigo-900 rounded-3xl p-8 mb-8 shadow-2xl border border-white/10 text-white relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-overlay filter blur-3xl opacity-20"></div>
                <h3 class="text-2xl font-black mb-6 flex items-center"><i class="fa-solid fa-trophy text-yellow-400 mr-3"></i> Inter-Class Cup</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 relative z-10">`;
                
            lb.slice(0, 6).forEach((cls, idx) => {
                let colors = idx === 0 ? 'bg-yellow-400/20 border-yellow-400/50 text-yellow-300' : 
                             idx === 1 ? 'bg-gray-400/20 border-gray-400/50 text-gray-300' : 
                             idx === 2 ? 'bg-orange-400/20 border-orange-400/50 text-orange-300' : 
                             'bg-white/5 border-white/10 text-white/70';
                
                let medal = idx === 0 ? '<i class="fa-solid fa-trophy text-yellow-400 drop-shadow-md"></i>' : 
                            idx === 1 ? '<i class="fa-solid fa-medal text-gray-300 drop-shadow-md"></i>' : 
                            idx === 2 ? '<i class="fa-solid fa-medal text-orange-400 drop-shadow-md"></i>' : 
                            `<span class="text-xl font-black opacity-60 w-8 text-center inline-block">#${idx + 1}</span>`;
                
                html += `<div class="rounded-2xl p-4 border ${colors} backdrop-blur-sm flex items-center justify-between transition-all hover:bg-white/10">
                    <div class="flex items-center"><div class="text-3xl mr-3 flex justify-center items-center">${medal}</div><div><div class="font-black text-xl">${cls.id}</div><div class="text-xs opacity-70">${cls.active} Active Students</div></div></div>
                    <div class="text-3xl font-black">${cls.acc}%</div>
                </div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        async function handleLogin() {
            const name = document.getElementById('login-name').value.trim();
            const classId = document.getElementById('login-class').value;
            const studentNum = document.getElementById('login-student-num').value;
            const pwd = document.getElementById('login-password').value.trim();
            const errorEl = document.getElementById('login-error');
            
            if(!name || (!pwd && name.toLowerCase() !== 'teacher')) { 
                errorEl.innerHTML = "<i class='fa-solid fa-triangle-exclamation mr-2'></i> Please fill in all fields."; errorEl.classList.remove('hidden'); return; 
            }
            
            if (name.toLowerCase() === 'teacher' && pwd === 'hkugac2026') {
                errorEl.classList.add('hidden');
                showLoader("Syncing Analytics Engine...");
                await syncCloudData(true);
                hideLoader();
                state.user = { name: 'Teacher', classId: 'Staff', studentNum: '0', role: 'teacher' }; 
                navigateTo('teacher'); 
                return;
            }
            
            if(!classId || !studentNum) {
                errorEl.innerHTML = "<i class='fa-solid fa-triangle-exclamation mr-2'></i> Please select Class and Number."; errorEl.classList.remove('hidden'); return;
            }
            
            if (studentNum === '35' && pwd === 'password') {
                errorEl.classList.add('hidden');
                showLoader("Syncing with Secure Cloud...");
                await syncCloudData(true);
                hideLoader();
                state.user = { name: name, classId: classId, studentNum: studentNum, role: 'student' }; 
                navigateTo('dashboard'); 
                return;
            }
            
            errorEl.classList.add('hidden');
            showLoader("Verifying Identity...");
            
            if (GOOGLE_WEB_APP_URL === "PASTE_YOUR_LINK_HERE" || !GOOGLE_WEB_APP_URL.startsWith("http")) {
                hideLoader(); errorEl.innerHTML = "<i class='fa-solid fa-link-slash mr-2'></i> Cloud URL not configured!"; errorEl.classList.remove('hidden'); return;
            }
            
            try {
                let url = `${GOOGLE_WEB_APP_URL}?action=verify&classId=${encodeURIComponent(classId)}&studentNum=${encodeURIComponent(studentNum)}&password=${encodeURIComponent(pwd)}`;
                let res = await fetch(url);
                let data = await res.json();
                
                if (data.status === 'success') {
                    await syncCloudData(true);
                    hideLoader();
                    state.user = { name: data.name, classId: classId, studentNum: studentNum, role: 'student' };
                    navigateTo('dashboard');
                } else if (data.status === 'wrong_password') {
                    hideLoader();
                    errorEl.innerHTML = "<i class='fa-solid fa-lock mr-2'></i> Incorrect Password."; errorEl.classList.remove('hidden');
                } else if (data.status === 'not_found') {
                    hideLoader();
                    errorEl.innerHTML = "<i class='fa-solid fa-user-xmark mr-2'></i> Student not found in Official Roster."; errorEl.classList.remove('hidden');
                } else {
                    hideLoader();
                    errorEl.innerHTML = "<i class='fa-solid fa-triangle-exclamation mr-2'></i> Cloud error. Did you click 'New Version' when deploying?"; errorEl.classList.remove('hidden');
                }
            } catch(e) {
                hideLoader();
                errorEl.innerHTML = "<i class='fa-solid fa-wifi mr-2'></i> Network Error. Are you online?"; errorEl.classList.remove('hidden');
            }
        }

        window.playVictoryChime = function() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); 
                osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.4); 
                gainNode.gain.setValueAtTime(0, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1.5);
            } catch(e) {}
        }

        async function saveRecord(score, total) {
            const allRecsCheck = [...(safeStorage.get('hkuga_science_scores_t1') || []), ...(window.cloudRecords || [])];
            const alreadySaved = allRecsCheck.some(r => r.articleId === state.selectedArticleId && isCurrentUser(r));
            
            if (alreadySaved) {
                state.currentQuizAnswers = {}; state.activeQuizArticleId = null;
                navigateTo('results'); return;
            }

            const artData = scienceData[state.selectedModuleId].articles.find(a => a.id === state.selectedArticleId);
            const answersStr = JSON.stringify(state.currentQuizAnswers);
            
            const newRecord = { 
                date: new Date().toLocaleDateString(), name: state.user.name, classId: state.user.classId, studentNum: state.user.studentNum, 
                moduleId: state.selectedModuleId, articleId: state.selectedArticleId, articleTitle: artData.title, 
                level: state.selectedLevel, score: score, total: total, timestamp: Date.now(), answers: answersStr
            };
            
            let records = safeStorage.get('hkuga_science_scores_t1') || []; 
            records.push(newRecord); 
            safeStorage.set('hkuga_science_scores_t1', records);

            let savedAnswers = {};
            try { savedAnswers = JSON.parse(window.localStorage.getItem('hkuga_quiz_answers_t1')) || {}; } catch(e) { savedAnswers = {}; }
            savedAnswers[`${state.user.name}_${state.user.classId}_${state.user.studentNum}_${state.selectedArticleId}`] = state.currentQuizAnswers;
            try { window.localStorage.setItem('hkuga_quiz_answers_t1', JSON.stringify(savedAnswers)); } catch(e) {}

            if (GOOGLE_WEB_APP_URL.startsWith("http")) {
                const sheetData = { date: newRecord.date, name: newRecord.name, classId: newRecord.classId, studentNum: newRecord.studentNum, moduleId: newRecord.moduleId, articleTitle: newRecord.articleTitle, level: newRecord.level, score: newRecord.score, total: newRecord.total, articleId: newRecord.articleId, answers: newRecord.answers };
                try { fetch(GOOGLE_WEB_APP_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(sheetData) }); } catch (e) {}
            }
            
            state.currentQuizAnswers = {}; state.activeQuizArticleId = null; navigateTo('results');
        }

        function fireConfetti() {
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#3b82f6', '#10b981'];
            for(let i=0; i<120; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'fixed'; conf.style.width = Math.random() * 10 + 5 + 'px'; conf.style.height = Math.random() * 10 + 5 + 'px'; 
                conf.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                conf.style.left = Math.random() * 100 + 'vw'; conf.style.top = '-20px';
                conf.style.zIndex = '99999'; conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                conf.style.pointerEvents = 'none';
                document.body.appendChild(conf);
                
                let duration = Math.random() * 3 + 2;
                conf.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*300 - 150}px, 100vh, 0) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: duration * 1000, easing: 'cubic-bezier(.37,0,.63,1)' }).onfinish = () => conf.remove();
            }
        }

        function renderResultsView() {
            const total = scienceData[state.selectedModuleId].articles.find(a=>a.id===state.selectedArticleId).quiz.length; 
            const percentage = (state.score / total) * 100;
            
            if (percentage === 100) {
                fireConfetti();
                playVictoryChime();
            }
            
            let msg = percentage === 100 ? "Outstanding Mastery!" : percentage >= 80 ? "Great Job!" : percentage >= 60 ? "Good Effort!" : "Keep Practicing!";
            let color = percentage === 100 ? "text-yellow-500" : percentage >= 80 ? "text-green-500" : percentage >= 60 ? "text-blue-500" : "text-red-500";
            let glow = percentage === 100 ? "gold-glow" : "glass-panel";
            let icon = percentage === 100 ? "fa-crown text-yellow-400 drop-shadow-md" : "fa-chart-simple text-gray-400";
            
            appContainer.innerHTML = `<div class="fade-in max-w-lg mx-auto text-center ${glow} rounded-3xl p-12 mt-10 border-t-8 border-t-primary relative overflow-hidden">
                <i class="fa-solid ${icon} text-6xl mb-6"></i>
                <h2 class="text-4xl font-black text-gray-800 drop-shadow-sm">${msg}</h2>
                <div class="text-8xl font-black ${color} my-8 drop-shadow-lg transform transition hover:scale-110">${state.score}<span class="text-5xl text-gray-300">/${total}</span></div>
                <div class="flex flex-col gap-4">
                    <button onclick="reviewPastQuiz()" class="bg-indigo-50/80 backdrop-blur-sm text-indigo-700 border-2 border-indigo-200 font-black py-4 text-xl rounded-xl hover:bg-indigo-100 transition shadow-sm hover:-translate-y-1"><i class="fa-solid fa-magnifying-glass mr-2"></i> Review Answers</button>
                    <button onclick="navigateTo('dashboard')" class="bg-gradient-to-r from-primary to-blue-800 text-white font-black py-4 text-xl rounded-xl hover:shadow-xl transition hover:-translate-y-1"><i class="fa-solid fa-home mr-2"></i> Dashboard</button>
                </div>
            </div>`;
        }

        function renderReviewView() {
            const mod = scienceData[state.selectedModuleId];
            const art = mod.articles.find(a=>a.id===state.selectedArticleId);
            
            let html = art.quiz.map((q, i) => {
                let opts = q.options.map((opt, o) => {
                    let isCorrect = o === q.answer; 
                    let isSelected = o === Number(state.currentQuizAnswers[i]); 
                    let style = 'bg-white/40 border-white text-gray-500 opacity-60'; 
                    let icon = ''; let badge = ''; let label = '';
                    
                    if (isCorrect && isSelected) { 
                        style = 'bg-green-100 border-green-400 text-green-900 shadow-md ring-2 ring-green-400/50'; 
                        icon = '<i class="fa-solid fa-check-circle text-3xl text-green-500 drop-shadow-sm"></i>'; 
                        badge = '<div class="w-10 h-10 rounded-xl bg-green-200 border-2 border-green-300 mr-4 flex items-center justify-center text-sm font-black text-green-700">✓</div>';
                        label = '<span class="ml-auto text-xs font-black text-green-700 uppercase tracking-wide bg-green-200/50 px-3 py-1.5 rounded-lg shadow-sm">Your Correct Answer</span>';
                    } else if (isCorrect && !isSelected) {
                        style = 'bg-green-50 border-green-300 text-green-800 shadow-sm ring-2 ring-green-300/30'; 
                        icon = '<i class="fa-solid fa-check-circle text-3xl text-green-400 opacity-90 drop-shadow-sm"></i>'; 
                        badge = '<div class="w-10 h-10 rounded-xl bg-green-100 border-2 border-green-200 mr-4 flex items-center justify-center text-sm font-black text-green-600">✓</div>';
                        label = '<span class="ml-auto text-xs font-black text-green-700 uppercase tracking-wide bg-green-200/50 px-3 py-1.5 rounded-lg shadow-sm">Correct Answer</span>';
                    } else if (isSelected && !isCorrect) { 
                        style = 'bg-red-50 border-red-300 text-red-800 shadow-inner opacity-95'; 
                        icon = '<i class="fa-solid fa-xmark-circle text-3xl text-red-400"></i>'; 
                        badge = '<div class="w-10 h-10 rounded-xl bg-red-100 border-2 border-red-200 mr-4 flex items-center justify-center text-sm font-black text-red-600">✗</div>';
                        label = '<span class="ml-auto text-xs font-black text-red-600 uppercase tracking-wide bg-red-200/50 px-3 py-1.5 rounded-lg shadow-sm">Your Answer</span>';
                    } else {
                        badge = `<div class="w-10 h-10 rounded-xl bg-gray-100 border-2 border-gray-200 mr-4 flex items-center justify-center text-sm font-black text-gray-400">${['A','B','C','D'][o]}</div>`;
                    }
                    
                    return `<div class="p-4 mb-3 border-2 rounded-2xl font-bold text-lg ${style} flex items-center transition-all duration-300">
                                ${badge} <span>${opt}</span> ${label} <div class="${icon ? 'ml-3' : ''}">${icon}</div>
                            </div>`;
                }).join('');
                
                let isQCorrect = Number(state.currentQuizAnswers[i]) === q.answer;
                let boxStyle = isQCorrect ? 'border-t-green-500' : 'border-t-red-500';
                let headerIcon = isQCorrect ? '<i class="fa-solid fa-check text-green-500"></i>' : '<i class="fa-solid fa-xmark text-red-500"></i>';
                
                return `<div class="relative glass-panel rounded-3xl shadow-xl overflow-hidden mb-8 border-t-8 ${boxStyle}">
                            <div class="p-8 relative z-10">
                                <div class="flex items-center mb-6">
                                    <div class="w-12 h-12 rounded-full bg-gray-100 border-2 border-gray-200 flex items-center justify-center text-xl font-black shadow-inner mr-5">${headerIcon}</div>
                                    <h3 class="text-xl font-black text-gray-800 flex-1 leading-snug">Q${i+1}. ${q.q}</h3>
                                </div>
                                <div class="flex flex-col gap-2">${opts}</div>
                            </div>
                        </div>`;
            }).join('');
            
            appContainer.innerHTML = `<div class="fade-in max-w-4xl mx-auto pb-24">
                <div class="flex justify-between items-center mb-8">
                    <button onclick="navigateTo('article', {articleId: '${art.id}'})" class="font-black glass-panel text-gray-700 px-5 py-3 rounded-xl hover:-translate-y-1 transition"><i class="fa-solid fa-arrow-left mr-2"></i> Back to Article</button>
                    <div class="glass-panel px-6 py-3 rounded-xl font-black text-gray-800 shadow-sm flex items-center"><i class="fa-solid fa-magnifying-glass text-blue-500 mr-2"></i> Review Mode</div>
                </div>
                ${html}
            </div>`;
        }

        async function renderStudentProgress() {
            showLoader("Refreshing Cloud Data...");
            let cloudRecs = await syncCloudData(false) || [];
            hideLoader();
            
            let localRecs = safeStorage.get('hkuga_science_scores_t1') || [];
            let rawRecords = [...localRecs, ...cloudRecs];
            
            const uniqueRecordsMap = new Map();
            rawRecords.forEach(r => {
                if (isCurrentUser(r)) {
                    if (!uniqueRecordsMap.has(r.articleId) || r.score > uniqueRecordsMap.get(r.articleId).score) {
                        uniqueRecordsMap.set(r.articleId, r);
                    }
                }
            });
            let records = Array.from(uniqueRecordsMap.values());
            const uniqueCompleted = records.length;
            
            let totalScore = 0; let totalPossible = 0;
            let progHtml = Object.keys(scienceData).map(k => {
                const modRecords = records.filter(r=>r.moduleId===k);
                const uniqueCount = modRecords.length; 
                const total = scienceData[k].articles.length;
                
                let modScore = 0; let modPossible = 0;
                modRecords.forEach(best => { 
                    totalScore += best.score; totalPossible += best.total; modScore += best.score; modPossible += best.total; 
                });
                
                let modAcc = modPossible > 0 ? Math.round((modScore/modPossible)*100) : 0;
                
                return `<div class="glass-panel p-8 rounded-3xl mb-6 transition hover:shadow-xl hover:-translate-y-1">
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <h4 class="text-2xl font-black text-gray-800">${k}</h4>
                            <p class="font-bold text-gray-500">${scienceData[k].title}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-black ${uniqueCount===total ? 'text-yellow-600 bg-yellow-100 border-yellow-300' : 'text-primary bg-blue-50 border-blue-200'} px-4 py-1 rounded-xl block mb-2 shadow-sm border"><i class="fa-solid ${uniqueCount===total ? 'fa-star' : 'fa-book-open'} mr-1"></i> ${uniqueCount}/${total} Completed</span>
                            <span class="text-sm font-bold text-gray-500">Module Accuracy: <span class="${modAcc >= 80 ? 'text-green-500' : modAcc >= 60 ? 'text-yellow-500' : 'text-red-500'} font-black text-lg">${modAcc}%</span></span>
                        </div>
                    </div>
                    <div class="w-full bg-gray-200/50 rounded-full h-4 mb-3 shadow-inner overflow-hidden border border-gray-300/50">
                        <div class="${scienceData[k].color} h-4 rounded-full transition-all duration-1000 shadow-md" style="width: ${(uniqueCount/total)*100}%"></div>
                    </div>
                    <div class="w-full bg-gray-100/50 rounded-full h-2 shadow-inner overflow-hidden">
                        <div class="bg-gradient-to-r from-yellow-400 to-green-500 h-2 rounded-full transition-all duration-1000" style="width: ${modAcc}%"></div>
                    </div>
                </div>`;
            }).join('');
            
            const accuracy = totalPossible > 0 ? Math.round((totalScore/totalPossible)*100) : 0;
            const badge = getStudentBadge(uniqueCompleted, accuracy);
            
            appContainer.innerHTML = `<div class="fade-in max-w-4xl mx-auto pb-20">
                <button onclick="navigateTo('dashboard')" class="mb-8 font-black glass-panel text-gray-700 px-5 py-2.5 rounded-xl hover:-translate-y-1 transition"><i class="fa-solid fa-arrow-left mr-2"></i> Dashboard</button>
                <div class="bg-gradient-hero rounded-3xl p-10 text-white shadow-2xl mb-10 flex flex-col md:flex-row justify-between items-center relative overflow-hidden">
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
                    <div class="relative z-10 text-center md:text-left mb-6 md:mb-0">
                        <h2 class="text-5xl font-black mb-2 drop-shadow-lg">My Progress</h2>
                        <div class="inline-flex items-center bg-white/20 px-4 py-2 rounded-xl backdrop-blur-md border border-white/30 shadow-inner mt-2">
                            <i class="fa-solid ${badge.icon} text-2xl ${badge.color} mr-3 drop-shadow-md"></i>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-wider opacity-80 mb-0.5">Current Rank</p>
                                <p class="text-xl font-black ${badge.color} drop-shadow-sm">${badge.title}</p>
                            </div>
                        </div>
                    </div>
                    <div class="text-center md:text-right relative z-10">
                        <p class="text-sm font-bold opacity-80 mb-1 uppercase tracking-wider">Total Accuracy</p>
                        <div class="text-7xl font-black text-yellow-300 drop-shadow-xl">${accuracy}%</div>
                    </div>
                </div>
                ${progHtml}
            </div>`;
        }

        window.exportCSV = function() {
            if (!window.currentTeacherData) return;
            
            let filterClass = document.getElementById('filter-class') ? document.getElementById('filter-class').value.toLowerCase() : '';
            let filterText = document.getElementById('filter-search') ? document.getElementById('filter-search').value.toLowerCase() : '';
            
            let filtered = window.currentTeacherData.filter(s => {
                let matchClass = filterClass === '' || s.classId.toLowerCase() === filterClass;
                let matchSearch = s.name.toLowerCase().includes(filterText) || String(s.studentNum) === filterText;
                return matchClass && matchSearch;
            });

            filtered.sort((a,b) => {
                if(a.classId !== b.classId) return a.classId.localeCompare(b.classId);
                return Number(a.studentNum) - Number(b.studentNum);
            });
            
            let csv = "Class,Number,Name,Articles Completed,Total Points,Quiz Accuracy %\n" + 
                      filtered.map(s => `${s.classId},${s.studentNum},"${s.name}",${s.completed},${s.totalPoints},${s.accuracy}`).join("\n");
                      
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); 
            if (link.download !== undefined) { 
                const url = URL.createObjectURL(blob); 
                link.setAttribute("href", url); 
                link.setAttribute("download", `S2_Science_Grades_${filterClass || 'All'}.csv`); 
                link.style.visibility = 'hidden'; 
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link); 
            }
        }

        async function renderTeacherDashboard() {
            showLoader("Syncing Analytics Engine...");
            let recs = await syncCloudData(false);
            hideLoader();
            
            appContainer.innerHTML = `<div class="fade-in max-w-6xl mx-auto pb-20">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                    <h2 class="text-4xl md:text-5xl font-black text-gray-900 drop-shadow-sm">Educator Command Center</h2>
                    <div class="flex gap-3">
                        <button onclick="exportCSV()" class="bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 transition-all text-white font-black py-3 md:py-4 px-8 rounded-xl shadow-xl hover:-translate-y-1"><i class="fa-solid fa-file-csv mr-2"></i> Export View to Excel</button>
                    </div>
                </div>
                <div id="teacher-content"></div>
            </div>`;
            
            if (!recs) recs = [];
            
            let studentMap = new Map();
            let articleMap = new Map();
            let totalPossible = 0;
            let totalScore = 0;
            
            // Calculate global total questions available in the term
            let globalTotalQuestions = 0;
            Object.values(scienceData).forEach(m => m.articles.forEach(a => globalTotalQuestions += a.quiz.length));
            window.globalTotalQuestions = globalTotalQuestions;
            
            recs.forEach(r => {
                let sKey = `${r.classId}_${r.studentNum}_${r.name}`;
                if(!studentMap.has(sKey)) studentMap.set(sKey, { name: r.name, classId: r.classId, studentNum: r.studentNum, articles: new Map() });
                let sData = studentMap.get(sKey);
                
                if(!sData.articles.has(r.articleId) || r.score > sData.articles.get(r.articleId).score) {
                    sData.articles.set(r.articleId, r);
                }
            });

            let strugglingHtml = '';
            let strugglingCount = 0;
            let finalStudentsList = [];
            
            studentMap.forEach(s => {
                let sTotal = 0; let sPos = 0;
                s.articles.forEach(art => {
                    sTotal += art.score; sPos += art.total;
                    totalScore += art.score; totalPossible += art.total;
                    
                    if(!articleMap.has(art.articleId)) articleMap.set(art.articleId, { title: art.articleTitle, score: 0, possible: 0 });
                    let aData = articleMap.get(art.articleId);
                    aData.score += art.score; aData.possible += art.total;
                });
                
                let acc = sPos > 0 ? Math.round((sTotal/sPos)*100) : 0;
                s.accuracy = acc;
                s.completed = s.articles.size;
                s.totalPoints = sTotal; // Store the raw total points
                finalStudentsList.push(s);
                
                if(acc < 50 && s.completed > 0) {
                    strugglingCount++;
                    strugglingHtml += `<div class="bg-red-100 text-red-800 px-3 py-1.5 rounded-lg text-sm font-bold border border-red-200 mb-2 flex justify-between"><span>${s.classId}-${s.studentNum} ${s.name}</span> <span>${acc}%</span></div>`;
                }
            });
            
            if(strugglingCount === 0) strugglingHtml = `<div class="text-green-600 font-bold text-center mt-4"><i class="fa-solid fa-check-circle text-2xl mb-2 block"></i>All students above 50%!</div>`;
            
            let classAvg = totalPossible > 0 ? Math.round((totalScore/totalPossible)*100) : 0;
            
            let hardestArticle = "None Yet";
            let hardestScore = 100;
            articleMap.forEach((val) => {
                let acc = Math.round((val.score/val.possible)*100);
                if(acc < hardestScore) { hardestScore = acc; hardestArticle = val.title; }
            });

            window.currentTeacherData = finalStudentsList;

            window.renderTeacherTable = function() {
                let filterClass = document.getElementById('filter-class').value.toLowerCase();
                let filterText = document.getElementById('filter-search').value.toLowerCase();
                
                let filtered = window.currentTeacherData.filter(s => {
                    let matchClass = filterClass === '' || s.classId.toLowerCase() === filterClass;
                    let matchSearch = s.name.toLowerCase().includes(filterText) || String(s.studentNum) === filterText;
                    return matchClass && matchSearch;
                });

                filtered.sort((a,b) => {
                    if(a.classId !== b.classId) return a.classId.localeCompare(b.classId);
                    return Number(a.studentNum) - Number(b.studentNum);
                });

                let tbody = document.getElementById('t-body');
                if(filtered.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500 font-bold">No students match this filter.</td></tr>`;
                    return;
                }

                tbody.innerHTML = filtered.map(s => {
                    let badgeColor = s.accuracy >= 75 ? 'text-green-500' : s.accuracy >= 50 ? 'text-yellow-500' : 'text-red-500';
                    return `<tr class="hover:bg-white/80 transition">
                        <td class="px-6 py-4 border-b font-black text-gray-800">${s.name}</td>
                        <td class="px-6 py-4 border-b text-gray-600 font-bold">${s.classId}-${s.studentNum}</td>
                        <td class="px-6 py-4 border-b"><span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-black border border-blue-200 shadow-sm">${s.completed} / 16</span></td>
                        <td class="px-6 py-4 border-b font-black text-lg text-yellow-600">${s.totalPoints} <span class="text-sm text-gray-400">/ ${window.globalTotalQuestions}</span></td>
                        <td class="px-6 py-4 border-b font-black text-lg ${badgeColor}">${s.accuracy}%</td>
                    </tr>`;
                }).join('');
            };

            document.getElementById('teacher-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="glass-panel p-6 rounded-3xl border-t-8 border-red-500 shadow-lg relative overflow-hidden">
                        <i class="fa-solid fa-triangle-exclamation absolute -right-4 -bottom-4 text-8xl text-red-500 opacity-10"></i>
                        <h3 class="text-xl font-black text-gray-800 mb-4">Struggling Students (< 50%)</h3>
                        <div class="max-h-32 overflow-y-auto pr-2">${strugglingHtml}</div>
                    </div>
                    <div class="glass-panel p-6 rounded-3xl border-t-8 border-blue-500 shadow-lg flex flex-col items-center justify-center relative overflow-hidden">
                        <i class="fa-solid fa-chart-pie absolute -right-4 -bottom-4 text-8xl text-blue-500 opacity-10"></i>
                        <h3 class="text-xl font-black text-gray-800 mb-2">Class Average</h3>
                        <div class="text-6xl font-black text-blue-600 drop-shadow-md">${classAvg}%</div>
                    </div>
                    <div class="glass-panel p-6 rounded-3xl border-t-8 border-yellow-500 shadow-lg relative overflow-hidden flex flex-col justify-center">
                        <i class="fa-solid fa-book-skull absolute -right-4 -bottom-4 text-8xl text-yellow-500 opacity-10"></i>
                        <h3 class="text-xl font-black text-gray-800 mb-2">Most Difficult Topic</h3>
                        <div class="text-2xl font-black text-yellow-600 leading-tight">${hardestArticle}</div>
                        <div class="text-sm font-bold text-gray-500 mt-2">Average Score: ${hardestScore}%</div>
                    </div>
                </div>

                <div class="glass-panel rounded-3xl overflow-hidden border border-gray-200 shadow-xl">
                    <div class="bg-slate-100 p-5 flex flex-col md:flex-row gap-4 border-b border-gray-300">
                        <div class="flex-1 relative">
                            <i class="fa-solid fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="filter-search" onkeyup="renderTeacherTable()" placeholder="Search by name or number..." class="w-full pl-12 pr-4 py-3 rounded-xl border-2 border-white focus:border-blue-400 outline-none font-bold text-gray-700 shadow-sm bg-white/80">
                        </div>
                        <select id="filter-class" onchange="renderTeacherTable()" class="px-6 py-3 rounded-xl border-2 border-white focus:border-blue-400 outline-none font-bold text-gray-700 shadow-sm bg-white/80 cursor-pointer">
                        <option value="">All Classes</option>
                        <option value="s2h">S2H</option><option value="s2k">S2K</option><option value="s2u">S2U</option><option value="s2g">S2G</option><option value="s2a">S2A</option><option value="s2c">S2C</option>
                    </select>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-slate-900 text-white border-b-4 border-slate-700">
                        <tr>
                            <th class="px-6 py-5 text-lg font-black">Name</th>
                            <th class="px-6 py-5 text-lg font-black">Class-No</th>
                            <th class="px-6 py-5 text-lg font-black">Articles Finished</th>
                            <th class="px-6 py-5 text-lg font-black text-yellow-300">Total Points</th>
                            <th class="px-6 py-5 text-lg font-black">Quiz Accuracy</th>
                        </tr>
                    </thead>
                    <tbody id="t-body"></tbody>
                </table>
            </div>
        `;
        window.renderTeacherTable();
    }

    navigateTo('login');
</script>
